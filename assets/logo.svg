<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">ampoule</title>
  <defs>
    <!-- Glass: violet, lighter toward the sealed end -->
    <linearGradient id="glass" x1="0" y1="-56" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d45c4"/>
      <stop offset="1" stop-color="#4b1d8c"/>
    </linearGradient>
    <!-- The dose: a beam of light along the axis, brightest at the neck -->
    <linearGradient id="core" x1="0" y1="-50" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.45" stop-color="#ffe7a8"/>
      <stop offset="1" stop-color="#ffcf6e" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-1" y="-0.2" width="3" height="1.4">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <!-- ISO 9187 form D: base, body, shoulder, bulb, constriction, stem, sealed tip -->
    <path id="ampoule" d="M-17 48V-6C-17-14-6.5-14-6.5-20C-6.5-22-7-23-7-24.5C-7-26.5-4.5-27-4.5-28.5C-4.5-30-5.5-30.5-5.5-32V-47C-5.5-51-1.5-54 0-56C1.5-54 5.5-51 5.5-47V-32C5.5-30.5 4.5-30 4.5-28.5C4.5-27 7-26.5 7-24.5C7-23 6.5-22 6.5-20C6.5-14 17-14 17-6V48Q17 56 9 56H-9Q-17 56-17 48Z"/>
    <clipPath id="inside"><use href="#ampoule"/></clipPath>
  </defs>
  <g transform="translate(64 64) rotate(20)">
    <use href="#ampoule" fill="url(#glass)"/>
    <g clip-path="url(#inside)">
      <!-- glass sheen down the left wall -->
      <rect x="-13" y="-8" width="3.5" height="58" rx="1.75" fill="#fff" opacity="0.16"/>
      <!-- the beam: a soft glow in the body around a bright core that runs up the stem -->
      <rect x="-5" y="-14" width="10" height="66" rx="5" fill="#ffd27a" opacity="0.4" filter="url(#glow)"/>
      <rect x="-1.75" y="-50" width="3.5" height="98" rx="1.75" fill="url(#core)"/>
    </g>
    <!-- the colour break ring at the constriction -->
    <rect x="-7.5" y="-30.25" width="15" height="3.5" rx="1.75" fill="#f2c14e"/>
  </g>
</svg>
