[package]
name = "ampoule"
version = "0.1.3"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/filipecabaco/ampoule"
publish = false
description = "Package an Erlang/Elixir release as one binary: the BEAM compiled to wasm, the release appended, and the OS layer (WASI, threads, sockets) in Rust"

[[bin]]
name = "ampoule"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cranelift", "all-arch", "gc", "gc-drc", "threads", "parallel-compilation", "std", "runtime", "addr2line", "demangle"] }
zstd = "0.14"

[build-dependencies]
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cranelift", "all-arch", "gc", "gc-drc", "threads", "parallel-compilation", "std", "runtime"] }
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
# A panic in a host function must take the whole VM down rather than leave a scheduler missing.
panic = "abort"
