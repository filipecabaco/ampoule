[package]
name = "ampoule"
version = "0.1.11"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/filipecabaco/ampoule"
publish = false
description = "Package an Erlang/Elixir release as one binary: the BEAM compiled to wasm, the release appended, and the OS layer (WASI, threads, sockets) in Rust"

[[bin]]
name = "ampoule"
path = "src/main.rs"

[features]
# Compiling wasm: precompiling engines relinked with NIFs when packing, and AMPOULE_ENGINE. A
# build without it (`--no-default-features`) only runs precompiled engines: the base the release
# packs apps on, smaller by Cranelift.
default = ["compiler"]
# addr2line and demangle only make a native backtrace of the runtime readable: the lean runtime
# leaves them out (about 0.4 MB).
compiler = ["wasmtime/cranelift", "wasmtime/all-arch", "wasmtime/parallel-compilation", "wasmtime/addr2line", "wasmtime/demangle"]

[dependencies]
anyhow = "1"
libc = "0.2"
rustix = { version = "1.1", features = ["event", "fs", "mm", "net", "param", "pipe", "process", "rand", "system", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "gc", "gc-drc", "threads", "std", "runtime"] }
zstd = "0.14"

[build-dependencies]
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cranelift", "all-arch", "gc", "gc-drc", "threads", "parallel-compilation", "std", "runtime"] }
sha2 = "0.11"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
# A panic in a host function must take the whole VM down rather than leave a scheduler missing.
panic = "abort"
# Symbols only name runtime frames in a native crash; dropping them takes about 2.8 MiB off every
# packed binary. Guest (Erlang) stack traces are unaffected.
strip = "symbols"
